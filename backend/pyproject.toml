[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
mypy_path = "backend" # mypyの実行起点となるディレクトリを指定

# 厳格な型チェックの設定
no_implicit_optional = true
python_version = "3.12"

# インポート解決のための設定
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# テスト実行時のログ出力を制御
log_cli = false
log_cli_level = "INFO"
